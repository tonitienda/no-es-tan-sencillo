<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">

</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0B0E14; font-family: 'Inter', sans-serif; color: #EEF1F5">

  <!-- back plane: the country the tiles were lifted from, far and soft -->
  <div aria-hidden="true" style="position: absolute; left: -100px; right: -100px; top: 560px; height: 260px; background: repeating-linear-gradient(90deg, rgba(43,52,69,0.6) 0 9px, transparent 9px 14px), repeating-linear-gradient(0deg, rgba(43,52,69,0.6) 0 9px, transparent 9px 14px); transform: perspective(600px) rotateX(70deg); transform-origin: 50% 0%; filter: blur(2px); opacity: 0.6"></div>

  <svg viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="26,6 millones de viviendas frente a 18,5 millones de hogares" style="position: absolute; inset: 0">
    <defs>
      <pattern id="v" x="160" y="292" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="18" height="18" rx="2" fill="#2B3445" stroke="#4A5568" stroke-width="1"></rect></pattern>
      <pattern id="h" x="160" y="292" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="18" height="18" rx="2" fill="#F5B85A"></rect></pattern>
    </defs>
    <!-- viviendas: 266 × 100.000 = 19 × 14 -->
    <rect x="160" y="292" width="418" height="308" fill="url(#v)"></rect>
    <!-- hogares: 185 × 100.000 = 9 rows of 19 + 14 -->
    <rect x="710" y="402" width="418" height="198" fill="url(#h)" style="filter: drop-shadow(0 0 8px rgba(245,184,90,0.45))"></rect>
    <rect x="710" y="380" width="308" height="22" fill="url(#h)" style="filter: drop-shadow(0 0 8px rgba(245,184,90,0.45))"></rect>
    <line x1="120" y1="601" x2="1160" y2="601" stroke="#5A6475" stroke-width="2"></line>
  </svg>

  <div style="position: absolute; left: 160px; top: 196px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-family: 'Archivo'; font-stretch: 72%; font-weight: 900; font-size: 64px; line-height: 1; color: #EEF1F5">26,6 M</span>
    <span style="font-size: 20px; color: #B7C0CC">viviendas</span>
  </div>
  <div style="position: absolute; left: 710px; top: 286px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-family: 'Archivo'; font-stretch: 72%; font-weight: 900; font-size: 64px; line-height: 1; color: #F5B85A">18,5 M</span>
    <span style="font-size: 20px; color: #B7C0CC">hogares</span>
  </div>

  <!-- the inference -->
  <div style="position: absolute; left: 160px; top: 64px; display: flex; align-items: baseline; gap: 16px">
    <span style="font-family: 'Archivo'; font-stretch: 72%; font-weight: 900; font-size: 92px; line-height: 1; color: #F2EDE4">1,44</span>
    <span style="font-size: 24px; color: #B7C0CC">viviendas por hogar. Sobre el papel, sobran.</span>
  </div>

  <div style="position: absolute; left: 160px; top: 616px; font: 13px 'IBM Plex Mono'; color: #8893A3">Cada baldosa: 100.000. Eje desde cero.</div>

  <div style="position: absolute; left: 56px; right: 56px; bottom: 32px; padding-top: 12px; border-top: 1px solid #2A3444; font: 15px 'IBM Plex Mono'; color: #B7C0CC">INE · Censo de Población y Viviendas 2021</div>
</div>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>K05 Cuatro preguntas</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0}</style>

<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0B0E14; font-family: 'Inter', sans-serif; color: #EEF1F5">

  <!-- ground plane receding -->
  <div aria-hidden="true" style="position: absolute; left: -200px; right: -200px; top: 470px; height: 420px; background: repeating-linear-gradient(90deg, rgba(43,52,69,0.7) 0 18px, transparent 18px 26px), repeating-linear-gradient(0deg, rgba(43,52,69,0.7) 0 18px, transparent 18px 26px); transform: perspective(700px) rotateX(68deg); transform-origin: 50% 0%"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 440px; height: 120px; background: linear-gradient(180deg, #0B0E14 20%, rgba(11,14,20,0) 100%)"></div>

  <!-- the open question, still floating from K04 -->
  <svg aria-hidden="true" viewBox="0 0 1280 720" width="1280" height="720" style="position: absolute; inset: 0; filter: blur(1.5px); opacity: 0.55">
    <g fill="#F5B85A" transform="translate(-60 40)"><circle cx="1060" cy="120" r="7"></circle><circle cx="1090" cy="104" r="7"></circle><circle cx="1120" cy="92" r="7"></circle><circle cx="1150" cy="84" r="7"></circle><circle cx="1180" cy="80" r="7"></circle><circle cx="1076" cy="78" r="7"></circle><circle cx="1108" cy="64" r="7"></circle><circle cx="1140" cy="56" r="7"></circle></g>
  </svg>

  <!-- four monoliths standing on the plain -->
  <div style="position: absolute; left: 0; right: 0; top: 170px; display: flex; justify-content: center; gap: 28px; perspective: 1200px">
    <div style="width: 240px; height: 310px; box-sizing: border-box; border-radius: 14px; border: 2px solid #3A4558; background: #0F141C; padding: 26px 22px; display: flex; flex-direction: column; justify-content: space-between; transform: rotateY(14deg)">
      <span style="font-family: 'Archivo'; font-stretch: 72%; font-weight: 900; font-size: 46px; line-height: 0.95; color: #EEF1F5">¿CUÁNTAS?</span>
      <span style="font: 14px 'IBM Plex Mono'; color: #8893A3">pendiente</span>
    </div>
    <div style="width: 240px; height: 310px; box-sizing: border-box; border-radius: 14px; border: 2px solid #3A4558; background: #0F141C; padding: 26px 22px; display: flex; flex-direction: column; justify-content: space-between; transform: rotateY(5deg)">
      <span style="font-family: 'Archivo'; font-stretch: 72%; font-weight: 900; font-size: 46px; line-height: 0.95; color: #EEF1F5">¿DÓNDE?</span>
      <span style="font: 14px 'IBM Plex Mono'; color: #8893A3">pendiente</span>
    </div>
    <div style="width: 240px; height: 310px; box-sizing: border-box; border-radius: 14px; border: 2px solid #3A4558; background: #0F141C; padding: 26px 22px; display: flex; flex-direction: column; justify-content: space-between; transform: rotateY(-5deg)">
      <span style="font-family: 'Archivo'; font-stretch: 72%; font-weight: 900; font-size: 46px; line-height: 0.95; color: #EEF1F5">¿PARA QUIÉN?</span>
      <span style="font: 14px 'IBM Plex Mono'; color: #8893A3">pendiente</span>
    </div>
    <div style="width: 240px; height: 310px; box-sizing: border-box; border-radius: 14px; border: 2px solid #3A4558; background: #0F141C; padding: 26px 22px; display: flex; flex-direction: column; justify-content: space-between; transform: rotateY(-14deg)">
      <span style="font-family: 'Archivo'; font-stretch: 72%; font-weight: 900; font-size: 46px; line-height: 0.95; color: #EEF1F5">¿PARA CUÁNDO?</span>
      <span style="font: 14px 'IBM Plex Mono'; color: #8893A3">pendiente</span>
    </div>
  </div>

  <!-- contact light under each monolith -->
  <div aria-hidden="true" style="position: absolute; left: 160px; right: 160px; top: 478px; height: 30px; background: radial-gradient(ellipse at 50% 0%, rgba(242,237,228,0.16), rgba(242,237,228,0) 70%)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-size: 20px; color: #B7C0CC">Las mismas cuatro, para cada frase.</div>

  <!-- where it will dock -->
  <div style="position: absolute; right: 40px; top: 28px; display: flex; gap: 6px; opacity: 0.6">
    <div style="width: 70px; height: 26px; border: 1.5px dashed #5A6475; border-radius: 6px"></div><div style="width: 70px; height: 26px; border: 1.5px dashed #5A6475; border-radius: 6px"></div><div style="width: 70px; height: 26px; border: 1.5px dashed #5A6475; border-radius: 6px"></div><div style="width: 70px; height: 26px; border: 1.5px dashed #5A6475; border-radius: 6px"></div>
  </div>
  <div style="position: absolute; right: 40px; top: 62px; font: 12px 'IBM Plex Mono'; color: #5A6475">→ se acopla aquí (HUD)</div>
</div>


</body>
</html>

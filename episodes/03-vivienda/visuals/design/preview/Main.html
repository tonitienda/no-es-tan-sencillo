<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cartela: No es tan sencillo</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0}</style>

<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0B0E14; font-family: 'Inter', sans-serif; color: #EEF1F5">

  <!-- far plane: the three sentences, out of focus, still hanging in the sky -->
  <div aria-hidden="true" style="position: absolute; left: 90px; top: 58px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 30px; color: #8893A3; opacity: 0.45; filter: blur(2.5px)">«Faltan 750.000 viviendas…»</div>
  <div aria-hidden="true" style="position: absolute; right: 110px; top: 96px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 26px; color: #8893A3; opacity: 0.4; filter: blur(3px)">«Hay 3,8 millones de vacías…»</div>
  <div aria-hidden="true" style="position: absolute; left: 380px; top: 22px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: #8893A3; opacity: 0.3; filter: blur(3.5px)">«…prohibirlos»</div>

  <!-- the city: a tilted dark Spain made of dwellings; lit = someone lives there -->
  <div aria-hidden="true" style="position: absolute; inset: 0; perspective: 1100px; perspective-origin: 50% 20%">
    <div style="position: absolute; left: 120px; top: 300px; width: 1040px; height: 820px; transform: rotateX(62deg) rotateZ(-6deg); transform-origin: 50% 30%; transform-style: preserve-3d">
      <svg viewBox="0 0 1040 820" width="1040" height="820" style="display: block; filter: drop-shadow(0 0 10px rgba(245,184,90,0.28))">
        <defs>
          <pattern id="lit" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="9" height="9" rx="1" fill="#F5B85A"></rect></pattern>
          <pattern id="dim" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="9" height="9" rx="1" fill="#2B3445"></rect></pattern>
          <pattern id="hol" width="42" height="42" patternUnits="userSpaceOnUse"><rect x="16.5" y="16.5" width="9" height="9" rx="1" fill="#0B0E14" stroke="#6F819A" stroke-width="1.2"></rect></pattern>
          <radialGradient id="pool"><stop offset="0" stop-color="#fff" stop-opacity="1"></stop><stop offset="0.55" stop-color="#fff" stop-opacity="0.35"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
          <mask id="lights">
            <rect width="1040" height="820" fill="#2a2a2a"></rect>
            <circle cx="464" cy="360" r="170" fill="url(#pool)"></circle>
            <circle cx="925" cy="262" r="140" fill="url(#pool)"></circle>
            <circle cx="722" cy="452" r="100" fill="url(#pool)"></circle>
            <circle cx="282" cy="661" r="95" fill="url(#pool)"></circle>
            <circle cx="410" cy="716" r="90" fill="url(#pool)"></circle>
            <circle cx="526" cy="84" r="80" fill="url(#pool)"></circle>
            <circle cx="712" cy="560" r="80" fill="url(#pool)"></circle>
            <circle cx="96" cy="120" r="70" fill="url(#pool)"></circle>
            <circle cx="690" cy="236" r="70" fill="url(#pool)"></circle>
          </mask>
          <clipPath id="es"><path d="M120 30 L200 45 L296 40 L400 60 L456 55 L520 65 L616 62 L648 90 L704 115 L784 130 L824 115 L896 150 L1016 160 L1016 210 L936 260 L840 295 L824 330 L760 400 L736 450 L776 520 L720 570 L696 640 L632 670 L592 730 L520 725 L408 730 L328 795 L280 760 L248 720 L168 680 L160 640 L200 600 L176 550 L200 500 L160 430 L208 380 L216 300 L264 240 L232 205 L160 215 L104 210 L48 190 L48 140 L16 110 L24 80 L96 50 Z"></path></clipPath>
        </defs>
        <g clip-path="url(#es)">
          <rect width="1040" height="820" fill="#10151E"></rect>
          <rect width="1040" height="820" fill="url(#dim)"></rect>
          <rect width="1040" height="820" fill="url(#lit)" mask="url(#lights)"></rect>
          <rect width="1040" height="820" fill="url(#hol)"></rect>
        </g>
        <path d="M120 30 L200 45 L296 40 L400 60 L456 55 L520 65 L616 62 L648 90 L704 115 L784 130 L824 115 L896 150 L1016 160 L1016 210 L936 260 L840 295 L824 330 L760 400 L736 450 L776 520 L720 570 L696 640 L632 670 L592 730 L520 725 L408 730 L328 795 L280 760 L248 720 L168 680 L160 640 L200 600 L176 550 L200 500 L160 430 L208 380 L216 300 L264 240 L232 205 L160 215 L104 210 L48 190 L48 140 L16 110 L24 80 L96 50 Z" fill="none" stroke="#3A4558" stroke-width="2"></path>
      </svg>
    </div>
  </div>

  <!-- haze where the plain meets the sky -->
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 330px; height: 140px; background: linear-gradient(180deg, rgba(11,14,20,0) 0%, rgba(11,14,20,0.85) 45%, rgba(11,14,20,0) 100%)"></div>

  <!-- near/HUD: the title -->
  <div style="position: absolute; left: 0; right: 0; top: 196px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 34px; color: #B7C0CC">La solución es <span style="text-decoration: line-through; text-decoration-color: #F2EDE4; text-decoration-thickness: 2px">evidente</span></div>
    <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 900; font-stretch: 72%; font-size: 150px; line-height: 0.92; letter-spacing: -0.01em; color: #F2EDE4; text-shadow: 0 0 40px rgba(242,237,228,0.18)">NO ES TAN SENCILLO</h1>
  </div>

  <!-- lens edge falloff -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%)"></div>
</div>


</body>
</html>

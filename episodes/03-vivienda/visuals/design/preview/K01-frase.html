<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>K01 Tres frases</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0}</style>

<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0B0E14; font-family: 'Inter', sans-serif; color: #EEF1F5">

  <!-- the city, present but not the subject -->
  <div aria-hidden="true" style="position: absolute; inset: 0; perspective: 1000px; perspective-origin: 50% 0%; filter: blur(5px); opacity: 0.85">
    <div style="position: absolute; left: 60px; top: 380px; width: 1160px; height: 900px; transform: rotateX(66deg); transform-origin: 50% 0%">
      <svg viewBox="0 0 1040 820" width="1160" height="900" preserveAspectRatio="none" style="display: block">
        <defs>
          <pattern id="t" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="9" height="9" rx="1" fill="#F5B85A"></rect></pattern>
          <radialGradient id="p"><stop offset="0" stop-color="#fff"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></radialGradient>
          <mask id="m"><rect width="1040" height="820" fill="#222"></rect><circle cx="464" cy="360" r="200" fill="url(#p)"></circle><circle cx="925" cy="262" r="150" fill="url(#p)"></circle><circle cx="282" cy="661" r="110" fill="url(#p)"></circle><circle cx="722" cy="452" r="110" fill="url(#p)"></circle></mask>
          <clipPath id="c"><path d="M120 30 L200 45 L296 40 L400 60 L456 55 L520 65 L616 62 L648 90 L704 115 L784 130 L824 115 L896 150 L1016 160 L1016 210 L936 260 L840 295 L824 330 L760 400 L736 450 L776 520 L720 570 L696 640 L632 670 L592 730 L520 725 L408 730 L328 795 L280 760 L248 720 L168 680 L160 640 L200 600 L176 550 L200 500 L160 430 L208 380 L216 300 L264 240 L232 205 L160 215 L104 210 L48 190 L48 140 L16 110 L24 80 L96 50 Z"></path></clipPath>
        </defs>
        <g clip-path="url(#c)"><rect width="1040" height="820" fill="#10151E"></rect><rect width="1040" height="820" fill="url(#t)" mask="url(#m)"></rect></g>
      </svg>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 340px; height: 120px; background: linear-gradient(180deg, #0B0E14 0%, rgba(11,14,20,0) 100%)"></div>

  <!-- next sentences waiting further back in the sky -->
  <div aria-hidden="true" style="position: absolute; right: 80px; top: 70px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 24px; color: #8893A3; opacity: 0.35; filter: blur(2.5px)">«Hay 3,8 millones de viviendas vacías…»</div>
  <div aria-hidden="true" style="position: absolute; right: 200px; top: 30px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 20px; color: #8893A3; opacity: 0.25; filter: blur(3.5px)">«Los pisos turísticos han echado…»</div>

  <!-- the sentence in focus -->
  <div style="position: absolute; left: 120px; top: 150px; width: 960px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; gap: 12px; align-items: center">
      <span style="font: 500 14px 'IBM Plex Mono'; padding: 5px 12px; border-radius: 999px; border: 1.5px dashed #F2EDE4; color: #F2EDE4">frase resumida por nosotros</span>
      <span style="font: 14px 'IBM Plex Mono'; color: #8893A3">1 / 3</span>
    </div>
    <div style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 72px; line-height: 1.04; color: #EEF1F5">«Faltan <span style="font-family: 'Archivo', sans-serif; font-style: normal; font-weight: 800; font-stretch: 75%; color: #F2EDE4">750.000</span> viviendas. La solución es evidente: construir».</div>
  </div>

  <!-- HUD: source -->
  <div style="position: absolute; left: 56px; right: 56px; bottom: 36px; padding-top: 12px; border-top: 1px solid #2A3444; display: flex; gap: 14px; align-items: center">
    <span style="font: 15px 'IBM Plex Mono'; color: #B7C0CC">Déficit: Banco de España</span>
    <span style="font: 500 13px 'IBM Plex Mono'; padding: 4px 10px; border-radius: 999px; border: 1.5px solid #8893A3; color: #B7C0CC">≈ estimación</span>
  </div>
</div>


</body>
</html>
